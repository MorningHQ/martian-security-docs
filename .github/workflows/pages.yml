name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  domain-diagnostics:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    steps:
      - name: Read Pages configuration and DNS health
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = "https://api.github.com/repos/" + os.environ["REPOSITORY"]
          report = {}
          for endpoint in ("pages", "pages/health"):
              for attempt in range(6):
                  request = urllib.request.Request(base + "/" + endpoint, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          status = response.status
                          payload = json.load(response)
                  except urllib.error.HTTPError as error:
                      status = error.code
                      payload = {"message": "GitHub API request returned HTTP " + str(status)}
                  if status != 202:
                      break
                  time.sleep(10)
              if endpoint == "pages" and status == 200:
                  payload = {key: payload.get(key) for key in (
                      "status", "cname", "html_url", "protected_domain_state",
                      "https_enforced", "https_certificate",
                  )}
              report[endpoint] = {"http_status": status, "result": payload}
          rendered = json.dumps(report, indent=2)
          print(rendered)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as summary:
              summary.write("```json\n" + rendered + "\n```\n")
          if any(value["http_status"] != 200 for value in report.values()):
              raise SystemExit("DNS diagnostic API retrieval is incomplete")
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
